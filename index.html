<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek Kelompok Peserta | HOMS 2026</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Gambar Banner Header Mobil View -->
        <img src="header.jpeg" alt="HOMS 2026 Banner" class="header-image">

        <div class="header-tag">HOMS 2026</div>
        <h2>Cek Kelompok</h2>
        <p class="subtitle">Masukkan data Anda untuk melihat pembagian kelompok pasar.</p>
        
        <form id="cekKelompokForm">
            <div class="form-group">
                <label for="namaLengkap">Nama Lengkap</label>
                <input type="text" id="namaLengkap" placeholder="Contoh: Rafael Pandu Amartya" required>
            </div>

            <div class="form-group">
                <label for="tanggalLahir">Tanggal Lahir</label>
                <input type="date" id="tanggalLahir" required>
            </div>

            <button type="submit" id="submitBtn">Cari Kelompok</button>
        </form>

        <div id="loading" class="loading hidden">Sedang mencari data di Google Sheets...</div>
        
        <div id="outputContainer" class="output-box hidden">
            <h4>Hasil Pencarian</h4>
            <p class="result-text">Anda masuk ke dalam kelompok:</p>
            <h1 id="kelompokResult">Nama Kelompok</h1>
        </div>

        <div class="credit">Created by Reiki</div>
    </div>

    <script>
        document.getElementById('cekKelompokForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const nama = document.getElementById('namaLengkap').value.trim();
            const tglLahir = document.getElementById('tanggalLahir').value;
            
            const submitBtn = document.getElementById('submitBtn');
            const loading = document.getElementById('loading');
            const outputContainer = document.getElementById('outputContainer');
            const kelompokResult = document.getElementById('kelompokResult');

            const N8N_WEBHOOK_URL = 'https://hstgr.cloud';

            submitBtn.disabled = true;
            loading.classList.remove('hidden');
            outputContainer.classList.add('hidden');
            outputContainer.classList.remove('error-box');

            try {
                const response = await fetch(N8N_WEBHOOK_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        nama_lengkap: nama,
                        tanggal_lahir: tglLahir 
                    })
                });

                if (!response.ok) throw new Error('Gagal terhubung ke server n8n');

                const data = await response.json();
                
                if (data.kelompok) {
                    kelompokResult.innerText = data.kelompok;
                    outputContainer.classList.remove('hidden');
                } else {
                    throw new Error(data.message || 'Data tidak ditemukan atau kelompok belum diacak.');
                }

            } catch (error) {
                kelompokResult.innerText = error.message;
                outputContainer.classList.add('error-box');
                outputContainer.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                loading.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
